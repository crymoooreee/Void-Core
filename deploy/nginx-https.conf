# Install ONLY after both certificates have been issued successfully.
server {
    listen 80;
    server_name crymoooreee.ru api.crymoooreee.ru;
    location /.well-known/acme-challenge/ { root /var/www/voidcore; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name crymoooreee.ru;
    ssl_certificate /etc/letsencrypt/live/crymoooreee.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crymoooreee.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/voidcore;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 443 ssl;
    server_name api.crymoooreee.ru;
    ssl_certificate /etc/letsencrypt/live/crymoooreee.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crymoooreee.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log off; # callback and email-token URLs must not enter access logs
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
}
